name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the crate version
        run: |
          crate_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          [ "v$crate_version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version" >&2; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        env:
          RUSTFLAGS: -C linker=rust-lld -C linker-flavor=ld.lld
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Handshake smoke test
        if: matrix.arch == 'x86_64'
        run: scripts/handshake-smoke.sh target/${{ matrix.target }}/release/umbriel-mcp
      - name: Package
        run: |
          name="umbriel-mcp-${GITHUB_REF_NAME}-${{ matrix.arch }}-linux"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/umbriel-mcp LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: umbriel-mcp-*.tar.gz

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum umbriel-mcp-*.tar.gz > SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
