[package]
name = "umbriel-mcp"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
authors = ["Nafees Ashker Sakir <nafees.ashker@gmail.com>"]
description = "MCP server for the Umbriel Wayland compositor: windows, workspaces, outputs, pointer and keyboard input, screenshots with OCR, and the clipboard."
license = "MIT"
repository = "https://github.com/dot-ASH/umbriel-mcp"
homepage = "https://github.com/dot-ASH/umbriel-mcp"
documentation = "https://github.com/dot-ASH/umbriel-mcp#readme"
readme = "README.md"
keywords = ["mcp", "wayland", "compositor", "umbriel", "automation"]
categories = ["command-line-utilities", "api-bindings", "os::linux-apis"]
exclude = ["/target", "/.github", "/AGENTS.md", "/CLAUDE.md", "/docs/agents", "/docs/spec-publishable-0.1.0.md", "/packaging"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "process"] }
wl-clipboard-rs = "0.9.5"
rustix = { version = "1.1.6", features = ["fs", "event"] }
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
toml_edit = "0.25.17"

[profile.release]
strip = true
lto = true
codegen-units = 1
